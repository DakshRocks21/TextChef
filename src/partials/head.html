<script>
(function () {
  try {
    var d = JSON.parse(localStorage.getItem('textchef'));
    if (d && d.v === 1 && d.data && (d.data.theme === 'light' || d.data.theme === 'dark')) document.documentElement.dataset.theme = d.data.theme;
  } catch (e) {}
  // Self-heal: if boot fails while online, drop service workers and caches, then reload once per session.
  var K = 'textchef-heal';
  function heal() {
    if (window.__tcBooted || !navigator.onLine) return;
    try { if (sessionStorage.getItem(K)) return; sessionStorage.setItem(K, '1'); } catch (e) { return; }
    var p = [];
    if ('serviceWorker' in navigator) p.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
    if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }));
    Promise.all(p).then(function () { location.reload(); }, function () { location.reload(); });
  }
  addEventListener('error', function () { if (!window.__tcBooted) heal(); }, true);
  addEventListener('unhandledrejection', function () { if (!window.__tcBooted) heal(); });
  setTimeout(heal, 15000);
})();
</script>
