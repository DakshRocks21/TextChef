<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset {{SITE_NAME}}</title>
<meta name="description" content="Clear the offline cache for {{SITE_NAME}} and load a fresh copy.">
<meta name="robots" content="noindex">
<link rel="icon" href="{{BASE}}icon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light dark; --bg: #f4f4f5; --panel: #fff; --line: #e4e4e7; --text: #18181b; --muted: #5f5f68; --accent: #4f4fd1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0c0e; --panel: #151518; --line: #26262b; --text: #ececef; --muted: #a3a3ad; --accent: #9b9cff; } }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 520px; margin: 10vh auto; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  label { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Reset {{SITE_NAME}}</h1>
  <p>If the app will not load or looks stuck on an old version, this clears its offline copy so the next visit fetches a fresh one.</p>
  <label><input type="checkbox" id="all"> Also delete saved recipes and settings</label>
  <button type="button" id="go">Reset now</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script>
document.getElementById('go').addEventListener('click', async function () {
  var status = document.getElementById('status');
  status.textContent = 'Working...';
  try {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(function (r) { return r.unregister(); }));
    }
    if (window.caches) {
      var keys = await caches.keys();
      await Promise.all(keys.map(function (k) { return caches.delete(k); }));
    }
    try { sessionStorage.clear(); } catch (e) {}
    if (document.getElementById('all').checked) { try { localStorage.removeItem('textchef'); } catch (e) {} }
    status.innerHTML = 'Done. <a href="{{BASE}}">Open {{SITE_NAME}}</a>';
  } catch (e) {
    status.textContent = 'Could not finish: ' + e.message + '. Try clearing site data in your browser settings.';
  }
});
</script>
</body>
</html>
